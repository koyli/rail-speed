# Fetches the latest timetable and network model, rebuilds the page and
# publishes it to GitHub Pages: weekly, on every push to main, or on demand.
# Needs repository secrets NROD_USER and NROD_PASS (Network Rail Open Data login).
name: Pages
on:
  schedule:
    - cron: "0 6 * * 6"   # Saturdays 06:00 UTC, so the page covers the coming Mon-Sun
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest
      - name: Fetch data
        env:
          NROD_USER: ${{ secrets.NROD_USER }}
          NROD_PASS: ${{ secrets.NROD_PASS }}
        run: python -m railspeed fetch schedule tps naptan
      - name: Build
        run: python -m railspeed build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
